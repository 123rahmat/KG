name: Provider smoke

# Calls the real model providers to catch API changes that the mocked test
# suite cannot see. It spends a few tokens, so it runs weekly and on demand
# rather than on every push. Providers without a secret are skipped.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run smoke:providers
        env:
          SMOKE_GOOGLE_API_KEY: ${{ secrets.SMOKE_GOOGLE_API_KEY }}
          SMOKE_GOOGLE_MODEL: gemini-3.8-flash
