name: CodeQL

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
          # Keep CodeQL analysis usable on repositories where code-scanning
          # upload is not enabled. The SARIF remains an immutable CI artifact;
          # enabling repository code scanning later can consume the same output.
          upload: false
          output: codeql-results
      - uses: actions/upload-artifact@043fb46f34566555426e8736cacfde1ee0c9d85a # v7.0.1
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: error
          retention-days: 14
