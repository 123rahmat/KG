name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: kindgleam-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    name: source-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run doctor
      - run: npm run eval:skills
      # Audit the complete dependency graph, including build/test tooling. A
      # compromised development dependency can still execute in CI and poison
      # artifacts or source before production packaging.
      - run: npm audit --audit-level=high
      - name: Generate dependency SBOM
        run: npm sbom --sbom-format=cyclonedx > npm-sbom.json
      - name: Upload dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-sbom
          path: npm-sbom.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate and unit-test the alert rules
        run: |
          docker run --rm -v "$PWD/docs/ops:/rules:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /rules/prometheus-alerts.yml
          docker run --rm -v "$PWD/docs/ops:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0 test rules prometheus-alerts.test.yml

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    # The suite runs against a real PostgreSQL, because everything it is
    # meant to prove — transactions, constraints, row locks, isolation —
    # only exists in a real one.
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm test

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kindgleam_migrations
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kindgleam_migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # Migrations must be safe to run twice — a rolling deploy will.
      - run: npm run migrate
      - run: npm run migrate

  backup-restore:
    name: backup-restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kindgleam_migrate:migration@127.0.0.1:5432/kindgleam_backup_source
      BACKUP_DATABASE_URL: postgres://kindgleam_backup:backup@127.0.0.1:5432/kindgleam_backup_source
      RESTORE_DATABASE_URL: postgres://kindgleam_restore:restore@127.0.0.1:5432/kindgleam_backup_target
      OBJECT_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      BACKUP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Create isolated backup and restore databases and roles
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgres://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE kindgleam_migrate LOGIN BYPASSRLS PASSWORD 'migration';
          CREATE ROLE kindgleam_backup LOGIN BYPASSRLS PASSWORD 'backup';
          CREATE ROLE kindgleam_restore LOGIN BYPASSRLS PASSWORD 'restore';
          CREATE DATABASE kindgleam_backup_source OWNER kindgleam_migrate;
          CREATE DATABASE kindgleam_backup_target OWNER kindgleam_migrate;
          GRANT kindgleam_migrate TO kindgleam_restore WITH INHERIT FALSE, SET TRUE;
          SQL
      - name: Apply schema to source database
        run: npm run migrate
      - name: Grant backup read access after migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgres://postgres:postgres@127.0.0.1:5432/kindgleam_backup_source" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CONNECT ON DATABASE kindgleam_backup_source TO kindgleam_backup;
          GRANT USAGE ON SCHEMA public TO kindgleam_backup;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO kindgleam_backup;
          GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO kindgleam_backup;
          SQL
      - name: Create encrypted backup
        run: |
          rm -rf ci-backups
          mkdir -p ci-backups
          BACKUP_DIR=ci-backups npm run backup
      - name: Restore backup into a separate database
        env:
          RESTORE_CONFIRM: I_UNDERSTAND
        run: |
          backup=$(find ci-backups -name '*.dump.enc' -type f -print -quit)
          test -n "$backup"
          npm run restore -- "$backup"
      - name: Verify restored schema
        env:
          PGPASSWORD: restore
        run: |
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) > 0 AS schema_restored FROM information_schema.tables WHERE table_schema = 'public';" | grep -q t

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [test, migrations, backup-restore]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build --pull --tag kindgleam:ci .
      - name: Inspect image configuration
        run: |
          test "$(docker image inspect kindgleam:ci --format '{{.Config.User}}')" = "node"
          docker image inspect kindgleam:ci --format '{{.Config.Env}}' | grep 'NODE_ENV=production'
      - name: Smoke test image runtime
        run: docker run --rm --entrypoint node kindgleam:ci -e "console.log('production image runtime OK')"
      - name: Scan production image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kindgleam:ci
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
      - name: Upload Trivy SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-image-scan
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 14


  production-boot:
    name: production-boot
    needs: [container, backup-restore]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kindgleam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kindgleam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kindgleam
      DATABASE_URL: postgres://kindgleam_runtime:runtime@127.0.0.1:5432/kindgleam
      DATABASE_MIGRATION_URL: postgres://kindgleam_migrate:migration@127.0.0.1:5432/kindgleam
      BACKUP_DATABASE_URL: postgres://kindgleam_backup:backup@127.0.0.1:5432/kindgleam
      RESTORE_DATABASE_URL: postgres://kindgleam_restore:restore@127.0.0.1:5432/kindgleam
      NODE_ENV: production
      PORT: 3100
      PGSSLMODE: disable
      COOKIE_SECURE: true
      RATE_LIMIT_STORE: postgres
      AI_PROVIDER: google
      GOOGLE_CLOUD_PROJECT: ci-test-project
      GOOGLE_CLOUD_LOCATION: global
      VERTEX_ACCESS_TOKEN: ci-dummy-token
      VERTEX_MODEL: gemini-3.8-flash
      AI_MODEL: gemini-3.8-flash
      OBJECT_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      RUNNER_TOKEN: ci-dummy-runner-token-32-characters-min
      MAX_REQUEST_BYTES: 8388608
      # Keep the process alive briefly after SIGTERM so CI can prove that
      # readiness flips before listener shutdown during a rolling deploy.
      SHUTDOWN_DRAIN_MS: 1500
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Generate CI-only encryption fixtures
        run: |
          echo "BILLING_ENCRYPTION_KEY=$(node -e "process.stdout.write(Buffer.alloc(32,0x42).toString('base64'))")" >> "$GITHUB_ENV"
          echo "PERSONAL_DATA_ENCRYPTION_KEY=$(node -e "process.stdout.write(Buffer.alloc(32,0x50).toString('base64'))")" >> "$GITHUB_ENV"
      - name: Create isolated production database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE kindgleam_migrate LOGIN BYPASSRLS PASSWORD 'migration';
          CREATE ROLE kindgleam_runtime LOGIN NOBYPASSRLS PASSWORD 'runtime';
          CREATE ROLE kindgleam_backup LOGIN BYPASSRLS PASSWORD 'backup';
          CREATE ROLE kindgleam_restore LOGIN BYPASSRLS PASSWORD 'restore';
          GRANT kindgleam_migrate TO kindgleam_restore WITH INHERIT FALSE, SET TRUE;
          ALTER DATABASE kindgleam OWNER TO kindgleam_migrate;
          SQL
      - name: Boot the production application against real PostgreSQL
        run: |
          node server.js > production-boot.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/ready > ready.json; then
              cat ready.json
              kill -TERM "$pid"
              draining=0
              for drain_attempt in $(seq 1 20); do
                code=$(curl --silent --output draining.json --write-out '%{http_code}' http://127.0.0.1:3100/api/ready || true)
                if [ "$code" = "503" ] && grep -q '"draining":true' draining.json; then
                  draining=1
                  break
                fi
                if ! kill -0 "$pid" 2>/dev/null; then
                  break
                fi
                sleep 0.1
              done
              if [ "$draining" != "1" ]; then
                echo "readiness did not enter draining state before shutdown"
                cat production-boot.log
                exit 1
              fi
              wait "$pid"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat production-boot.log
              exit 1
            fi
            sleep 1
          done
          cat production-boot.log
          exit 1
