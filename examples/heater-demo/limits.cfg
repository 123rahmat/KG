# Safe operating limits for the demo heater board, set by the hardware owner and signed.
# Any test value or firmware safety constant outside these is rejected before anything runs.
BOARD demo-heater-board rev-A
# Heater element and enclosure are rated to 120 C.
RANGE setpoint 0 120
RANGE sensor -60 300
NOISE_MAX 2
DISTURB_MAX 50
# The firmware's hard cutoff must stay between 60 and 95 C.
CONST FW_TEMP_HARD_CUT_C 60 95
CONST FW_SENSOR_OPEN_C -60 -20
