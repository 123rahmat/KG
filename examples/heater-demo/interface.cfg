# Signals of the heater controller. Order = order of fw_step's in[] and out[] arrays.
INTERFACE heater-controller v2
RATE_HZ 200
INPUT  setpoint C   0    120 COMMAND 60
INPUT  sensor   C  -100  300 SENSOR TOL 0.01
OUTPUT heater   -   0    1   SAFE 0 TOL 0.001
# If the firmware hangs, assume the worst: the heater output stage sticks fully on.
HANG_LATCH max
TIMING_BUDGET_US 200
