# Target the project expects. Detection must match all of it before anything runs on hardware.
BOARD demo-heater-board rev-A
# STM32F405/407 device id (DBGMCU_IDCODE & 0xFFF)
CHIP_ID 0x413
# Until the real board is connected, PIL runs against a simulated board speaking the same protocol.
TARGET virtual
VIRTUAL_IDENTITY demo-heater-board rev-A 0x413
VIRTUAL_LINK_FAULTS_PPM 200
LINK_TIMEOUT_MS 20
LINK_RETRIES 5
# Firmware may only be written here. Bootloader and option bytes are never touched.
FLASH_APP 0x08008000 0x08100000
FLASH_PROTECTED 0x08000000 0x08008000
FLASH_PROTECTED 0x1fffc000 0x1fffc010
