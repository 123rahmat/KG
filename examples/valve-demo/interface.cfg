# Spring-return valve positioner. Order = order of fw_step's in[] and out[] arrays.
INTERFACE valve-positioner v1
RATE_HZ 1000
INPUT  target   %   0    100  COMMAND 0
INPUT  enable   -   0    1    COMMAND 1
INPUT  position %  -50   150  SENSOR TOL 0.01
OUTPUT drive    -  -1    1    SAFE 0 TOL 0.001
# A hung controller keeps its last drive until the watchdog removes it.
HANG_LATCH last
TIMING_BUDGET_US 50
